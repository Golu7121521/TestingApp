name: hindi_movie_stream
description: "A professional Indian movie and web series streaming discovery app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # REST API requests
  http: 1.2.2

  # Image caching
  cached_network_image: 3.4.1

  # Native ExoPlayer (HLS, MP4, Multi-Audio) - Compatible with AGP 8.3.2 / Kotlin 1.9.24
  better_player_plus: 1.0.8

  # Pinned exactly to satisfy better_player_plus requirement without pulling Kotlin 2.x / Gradle 8.13
  wakelock_plus: 1.2.10

  # In-App YouTube Trailer Player
  webview_flutter: 4.10.0

  # URL Launcher
  url_launcher: 6.3.0

  # Icons
  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0

flutter:
  uses-material-design: true
