import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.personal.activitypeek"

    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.personal.activitypeek"
        minSdk {
            version = release(24)
        }
        targetSdk {
            version = release(36)
        }
        versionCode 1
        versionName "1.0.0"

        // Build native code for arm64 only
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    androidResources {
        // Keep only English resources (also strips library translations) to reduce APK size
        localeFilters 'en'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_11)
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "activity-peek_v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}

configurations.all {
    resolutionStrategy {
        force('org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0')
    }
}
