plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mtmanager.lite'
    compileSdk 34

    defaultConfig {
        applicationId "com.mtmanager.lite"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Sora Editor for Advanced Syntax Highlighting & Text Editing
    implementation 'io.github.Rosemoe.sora-editor:editor:0.22.4'
    implementation 'io.github.Rosemoe.sora-editor:language-java:0.22.4'
    implementation 'io.github.Rosemoe.sora-editor:language-textmate:0.22.4'
}
