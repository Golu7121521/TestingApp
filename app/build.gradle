plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.offlineplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.offlineplayer"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Only ship English strings/resources -> smaller APK
        resConfigs "en"

        // libvlc-all bundles native .so files for 4 CPU architectures; almost every
        // real device today is one of these two, so we drop the legacy x86/x86_64
        // ones to keep the APK size reasonable.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // Shrink + obfuscate + strip unused resources for the smallest possible APK
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No keystore is configured in CI, so sign the release build with the
            // debug key just so GitHub Actions can produce an installable APK.
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/notice.txt', 'META-INF/*.kotlin_module']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // libVLC - the exact same playback engine VLC itself uses. This is the
    // single most format/protocol-agnostic player library available on Android:
    // out of the box it plays local files of almost any codec/container PLUS
    // every kind of link - http/https, hls (.m3u8), dash (.mpd), rtsp, rtmp,
    // mms, udp, rtp, smb, ftp, and more - with no extra modules needed.
    implementation 'org.videolan.android:libvlc-all:3.5.1'

    // Glide - generates video thumbnails from local files
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
