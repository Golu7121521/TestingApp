plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.offlineplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.offlineplayer"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Only ship English strings/resources -> smaller APK
        resConfigs "en"
    }

    buildTypes {
        release {
            // Shrink + obfuscate + strip unused resources for the smallest possible APK
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No keystore is configured in CI, so sign the release build with the
            // debug key just so GitHub Actions can produce an installable APK.
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/notice.txt', 'META-INF/*.kotlin_module']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Media3 ExoPlayer - the current best-in-class, actively maintained Android
    // playback library. Core module alone already plays MP4, MKV, WebM, 3GP,
    // OGG, MP3, AAC, FLAC, WAV, AMR, TS/TS-H265, FLV, etc. via its built-in
    // extractors. These extra modules add support for every *type of link*
    // (not just plain files): HLS (.m3u8), DASH (.mpd) and RTSP streams.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'

    // Glide - generates video thumbnails from local files
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
