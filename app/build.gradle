plugins {
    id 'com.android.application'
}

def ksFile = System.getenv("KEYSTORE_FILE")

android {
    namespace 'com.gamerec.lite'
    compileSdk 36

    defaultConfig {
        applicationId "com.gamerec.lite"
        minSdk 21
        targetSdk 36
        versionCode 11
        versionName "2.5"
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packaging {
        resources {
            // keep META-INF/services: the library's coroutines need it at runtime
                excludes += ['/META-INF/*.version', '/META-INF/*.kotlin_module', '/META-INF/LICENSE*',
                             '/META-INF/NOTICE*', '/META-INF/AL2.0', '/META-INF/LGPL2.1',
                             '/kotlin/**', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Screen capture + H.264/AAC encoding + MP4 muxing (Apache-2.0, via JitPack)
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
}
