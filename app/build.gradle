plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.newtube.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.newtube.player"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'

    // AndroidX & Material UI
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Latest TeamNewPipe Extractor from GitHub JitPack (dev-SNAPSHOT has the latest YouTube player JS decryption fixes)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:dev-SNAPSHOT'

    // Mozilla Rhino JS Engine (Required by NewPipeExtractor on Android to decrypt YouTube stream URLs & throttling n-params)
    implementation 'org.mozilla:rhino:1.7.14'

    // OkHttp for NewPipe Downloader & ExoPlayer DataSource
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Media3 ExoPlayer (with DASH, HLS, and OkHttp DataSource for MergingMediaSource video+audio playback)
    implementation 'androidx.media3:media3-exoplayer:1.3.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.0'
    implementation 'androidx.media3:media3-ui:1.3.0'

    // Coil for loading YouTube thumbnails & Channel avatars
    implementation 'io.coil-kt:coil:2.6.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
