coil = "2.7.0"
datastore = "1.1.1"
work = "2.9.1"
palette = "1.0.0"
guava = "33.3.1-android"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
