name: Build APK and publish to Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "PDF-Pro-${TAG}.apk"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      # APK goes straight to Releases (no Actions artifact storage used)
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PDF Pro ${{ env.TAG }}
          generate_release_notes: true
          files: PDF-Pro-${{ env.TAG }}.apk
