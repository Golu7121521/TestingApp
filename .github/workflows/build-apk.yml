name: Build APK from zip and release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip file found in repo root"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project
          GRADLEW=$(find /tmp/project -name gradlew -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$GRADLEW" ]; then echo "gradlew not found inside zip"; exit 1; fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          cp "$APK" MyTube.apk
          gh release create "build-${{ github.run_number }}" MyTube.apk \
            --repo "${{ github.repository }}" \
            --title "MyTube build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}"
