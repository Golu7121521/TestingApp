name: Build ARM64 APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ARM64 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate & Rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          cp "$APK_PATH" SaavnTune-arm64-v8a.apk
          echo "apk_file=SaavnTune-arm64-v8a.apk" >> $GITHUB_OUTPUT

      - name: Publish directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SaavnTune v1.0.${{ github.run_number }} (ARM64)
          body: |
            Automated ARM64 (`arm64-v8a`) APK build for SaavnTune.
            Download `SaavnTune-arm64-v8a.apk` below and install on your Android device.
          files: ${{ steps.apk.outputs.apk_file }}
          draft: false
          prerelease: false
