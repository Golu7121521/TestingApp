name: Build ARM64 APK & Upload to Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build ARM64 Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace || gradle assembleRelease --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          echo "Listing all generated APKs:"
          find app/build/outputs/apk/ -name "*.apk" -ls
          
          # Pehli matching release APK dhoondh kar copy karega
          APK_PATH=$(find app/build/outputs/apk/ -type f -name "*release*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK nahi mili!"
            exit 1
          fi
          
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" YouTubeNewPipe-arm64-v8a.apk

      - name: Upload APK directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "YouTube NewPipe ARM64 Build #${{ github.run_number }}"
          body: |
            Real YouTube client powered by **NewPipeExtractor** & **ExoPlayer**.
            - Architecture: `arm64-v8a` only
            - Build Number: `${{ github.run_number }}`
          files: YouTubeNewPipe-arm64-v8a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
