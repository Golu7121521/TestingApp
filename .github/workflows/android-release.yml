name: Build ARM64 APK & Upload to Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7 (Fixes Gradle 9.8.2 AGP conflict)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build ARM64 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename ARM64 APK
        run: |
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk YouTubeNewPipe-arm64-v8a.apk

      - name: Upload APK directly to GitHub Releases (Zero Artifact Quota Used)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "YouTube NewPipe ARM64 Build #${{ github.run_number }}"
          body: |
            Real YouTube client powered by **NewPipeExtractor** & **ExoPlayer**.
            - Architecture: `arm64-v8a` only
            - Signed and ready to install on Android devices.
          files: YouTubeNewPipe-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
