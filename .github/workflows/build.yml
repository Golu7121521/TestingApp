name: Build and Release (arm64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0)"
        required: true
        default: "v1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace -Pvc=${{ github.run_number }} -Pvn=${{ github.event.inputs.tag || github.ref_name }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk UniversalPlayer-arm64-v8a.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Universal Player ${{ github.event.inputs.tag || github.ref_name }}
          files: UniversalPlayer-arm64-v8a.apk
