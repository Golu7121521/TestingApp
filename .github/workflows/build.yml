name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: true

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/simpleplayer

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SimplePlayer"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.simpleplayer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.simpleplayer"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Video Player"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/simpleplayer/MainActivity.kt <<'EOF'
          package com.example.simpleplayer

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.FrameLayout
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class MainActivity : Activity() {
              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = FrameLayout(this)
                  playerView = PlayerView(this)
                  root.addView(
                      playerView,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  val btn = Button(this)
                  btn.text = "Video chuno"
                  btn.setOnClickListener { pickVideo() }
                  root.addView(
                      btn,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.END
                      )
                  )
                  setContentView(root)
                  intent?.data?.let { play(it) }
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  intent?.data?.let { play(it) }
              }

              private fun pickVideo() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "video/*"
                  startActivityForResult(i, 1)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1 && resultCode == RESULT_OK) {
                      data?.data?.let { play(it) }
                  }
              }

              private fun play(uri: Uri) {
                  player?.release()
                  // Hardware decoding pehle, fail ho to dusra decoder try karega
                  val factory = DefaultRenderersFactory(this)
                      .setEnableDecoderFallback(true)
                      .setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_OFF)
                  val p = ExoPlayer.Builder(this, factory).build()
                  playerView.player = p
                  p.setMediaItem(MediaItem.fromUri(uri))
                  p.prepare()
                  p.playWhenReady = true
                  player = p
              }

              override fun onStop() {
                  super.onStop()
                  player?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  player = null
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoPlayer.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Video Player v${{ github.run_number }}
          files: VideoPlayer.apk
