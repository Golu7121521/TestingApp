name: Build Git Action Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build release APK (shrunk)
        run: gradle assembleRelease --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" GitActionBuild.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" GitActionBuild.apk \
            --title "Build #${{ github.run_number }}" \
            --notes "APK built from commit ${{ github.sha }}" \
            --target "${{ github.sha }}" \
          || gh release upload "$TAG" GitActionBuild.apk --clobber
