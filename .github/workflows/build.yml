name: Build StreamPlay APK & Source ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Android Project Structure
        run: python3 build_project.py

      - name: Package Complete Project Source ZIP
        run: |
          zip -r StreamPlay-Complete-Project.zip settings.gradle.kts build.gradle.kts gradle.properties app/

      - name: Upload Complete Project Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Complete-Project-Source-ZIP
          path: StreamPlay-Complete-Project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Verify libandroidx.graphics.path.so inside APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "libandroidx.graphics.path.so"

      - name: Upload Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlay-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
