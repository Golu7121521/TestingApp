name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build arm64 Release APK
        run: ./gradlew assembleRelease

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/GameRecorder-arm64-v8a.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Game Screen Recorder v1.0.${{ github.run_number }}"
          body: "Automated arm64-v8a release built via GitHub Actions. Optimized for 1080p 60FPS smooth gaming recording without lag."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
