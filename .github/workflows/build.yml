name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (works with extracted files OR an uploaded .zip)
        run: |
          mkdir -p /tmp/proj
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -oq "$z" -d /tmp/proj; fi
          done
          F=$(find . /tmp/proj -name settings.gradle.kts -not -path "*/build/*" 2>/dev/null | head -n1)
          if [ -z "$F" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          echo "ROOT=$(dirname "$F")" >> $GITHUB_ENV

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NetPlayer-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
