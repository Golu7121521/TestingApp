name: Build arm64 APK and publish to Releases

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works both when the repo holds the full project AND when you only uploaded PDFly.zip
      - name: Locate project
        id: loc
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            zip_file=$(ls ./*.zip | head -n1)
            mkdir -p _src
            unzip -q "$zip_file" -d _src
            d=$(dirname "$(find _src -name settings.gradle.kts | head -n1)")
            echo "dir=$d" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build release APK (arm64-v8a)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle :app:assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Rename APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PDFly-1.0.${{ github.run_number }}-arm64-v8a.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PDFly 1.0.${{ github.run_number }}
          body: "PDFly (arm64-v8a). Download the .apk below and install it on your phone."
          files: PDFly-1.0.${{ github.run_number }}-arm64-v8a.apk
