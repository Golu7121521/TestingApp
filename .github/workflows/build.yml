name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnostic - Lottie on compile classpath?
        run: |
          gradle :app:dependencies --configuration debugCompileClasspath --no-daemon | grep -i lottie || echo "LOTTIE NOT ON CLASSPATH"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceHealth-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
