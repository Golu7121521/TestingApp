name: Build ARM64 APK to Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug ARM64 APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk UniversalStreamPlayer-arm64.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Universal Stream Player v1.0.${{ github.run_number }} (ARM64)"
          body: "Automated build for arm64-v8a. Supports HLS, DASH, DRM, Custom Headers, and Social Video Extraction."
          files: UniversalStreamPlayer-arm64.apk
          prerelease: false
