name: Build arm64 APK

# Har push par apne aap build hoga aur APK seedha Releases mein jayega.
# Artifacts use NAHI hote (aapka artifact limit khatam hai), isliye koi storage quota nahi lagta.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # Release banane ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: true   # cache bhi storage quota use karta hai

      - name: Build release APK (arm64-v8a only)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" GameRecorder-arm64-v8a.apk
          ls -lh GameRecorder-arm64-v8a.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Game Recorder build ${{ github.run_number }}
          body: |
            arm64-v8a APK (commit ${{ github.sha }})
            Install karne ke liye `GameRecorder-arm64-v8a.apk` download karo.
          files: GameRecorder-arm64-v8a.apk
          make_latest: true
