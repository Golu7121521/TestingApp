name: Build arm64 APK

# Runs automatically on every push to a branch.
# Only branch pushes trigger it, so the release tags created below do not start a new build.
on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK installed. Install only the
      # components the app needs, and skip android-actions/setup-android,
      # which fails because it tries to install the obsolete 'tools' package.
      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build arm64 release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*arm64*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No arm64 APK found" >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
