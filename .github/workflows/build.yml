name: Build and Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          add-job-summary: never

      - name: Build release APK (arm64-v8a only)
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FileForge-v1.0.${{ github.run_number }}-arm64-v8a.apk

      # APK goes straight to Releases - no upload-artifact used
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FileForge v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: FileForge-v1.0.${{ github.run_number }}-arm64-v8a.apk
