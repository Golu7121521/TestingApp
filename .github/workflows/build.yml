name: Build ARM64 APK & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias screenrecorder \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=ScreenRecorder, OU=Mobile, O=App, L=City, S=State, C=US"

      - name: Build ARM64 Release APK
        env:
          KEYSTORE_PASSWORD: android123
          KEY_ALIAS: screenrecorder
          KEY_PASSWORD: android123
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare ARM64 APK Artifact
        run: |
          mkdir -p release-output
          APK_PATH=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: ARM64 APK not found!"
            exit 1
          fi
          cp "$APK_PATH" release-output/ScreenRecorder-v1.0.${{ github.run_number }}-arm64-v8a.apk
          ls -lh release-output/

      - name: Create GitHub Release with ARM64 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScreenRecorder v1.0.${{ github.run_number }} (ARM64)
          body: |
            Automated build of **ScreenRecorder** for `arm64-v8a` devices.
            - Architecture: `arm64-v8a` only
            - Build #${{ github.run_number }}
          files: release-output/*.apk
          draft: false
          prerelease: false
