name: Build Game Recorder (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.3'

    - name: Prepare release key (only if secrets are set)
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build release APK and AAB
      run: ./gradlew assembleRelease bundleRelease --stacktrace

    - name: Dump RootEncoder API (only if build failed)
      if: failure()
      run: |
        for j in $(find ~/.gradle/caches -name 'encoder-2.8.1*.jar' -o -name 'library-2.8.1*.jar' | grep -v sources | head -4); do
          echo "== $j"; unzip -l "$j" | grep -E 'sources/|GenericStream|ConnectChecker|RecordController' | awk '{print $4}' | head -60
        done
        J=$(find ~/.gradle/caches -name 'library-2.8.1*.jar' | head -1); E=$(find ~/.gradle/caches -name 'encoder-2.8.1*.jar' | head -1)
        javap -cp "$J:$E" com.pedro.library.generic.GenericStream com.pedro.library.base.StreamBase || true

    - name: Upload APK and AAB
      uses: actions/upload-artifact@v4
      with:
        name: GameRecorder
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab
