name: Build arm64 APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.vibe --project-name vibe_player .

      - name: Configure manifest (permissions + app name)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ('<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n'
                   '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    ')
          s = s.replace('<application', perms + '<application', 1)
          s = s.replace('android:label="vibe_player"', 'android:label="Vibe Player"')
          open(p, 'w').write(s)
          PY

      - run: flutter pub get

      - name: Build release APK (arm64 only)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk VibePlayer-arm64.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Vibe Player ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: VibePlayer-arm64.apk
