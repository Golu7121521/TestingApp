name: Build APK & Project ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Android Project & ZIP
        run: python3 generate_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Source Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BlueStreamPlayer-Project-ZIP
          path: BlueStreamPlayer_Source.zip

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStreamPlayer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
