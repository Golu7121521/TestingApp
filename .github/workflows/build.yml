name: Build and Release ARM64 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build arm64 Release APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleRelease
        else
          gradle assembleRelease
        fi

    - name: Sign APK (Debug/Unsigned or Release)
      run: |
        echo "APK build complete."

    - name: Release ARM64 APK to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/release/app-arm64-v8a-release.apk,app/build/outputs/apk/release/app-release.apk
        tag_name: v1.0.0-${{ github.run_number }}
        name: MT Manager Lite v1.0.0 (ARM64)
        body: "Automated arm64 build for Redmi 9 Prime and Android devices."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
