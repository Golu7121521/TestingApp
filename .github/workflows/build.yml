name: Build PlayVid

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true only when the keystore secret has been added to the repo
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle itself, so no gradle-wrapper.jar is required in the repo
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Debug APKs skip minification/resource-shrinking entirely and bundle every CPU
      # architecture's native libraries into one file, so they're far bigger than what actually
      # ships. This release build applies both (and the 4 per-architecture splits below) even
      # without a signing key — the resulting APKs just aren't signed for the Play Store yet.
      - name: Build release APKs (armeabi-v7a, arm64-v8a, x86, x86_64)
        run: gradle assembleRelease --stacktrace

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: PlayVid-release
          path: app/build/outputs/apk/release/*.apk

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release (APK + AAB)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Upload signed release files
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PlayVid-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
