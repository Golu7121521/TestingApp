name: Build Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME) and sdkmanager,
      # so android-actions/setup-android is not needed (it fails on 'tools' package lookup).
      - name: Install SDK packages
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" > /dev/null

      # Gradle install + caching. The wrapper jar is a binary, so the wrapper is generated here.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Read version
        id: ver
        run: |
          echo "name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="${{ runner.temp }}/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "SIGN_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets not set - using a temporary keystore. Updates will not install over APKs signed with a different key."
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass android -keypass android \
              -alias mytune -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MyTune"
            echo "SIGN_PASSWORD=android" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=mytune" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ env.SIGN_PASSWORD }}
          KEY_ALIAS: ${{ env.SIGN_ALIAS }}
          KEY_PASSWORD: ${{ env.SIGN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" "MyTune-arm64-v8a-${{ steps.ver.outputs.name }}.apk"

      # Publish straight to Releases (no actions/upload-artifact)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Unique tag per run => always a NEW release (never attaches to an old one)
          tag_name: mytune-v${{ steps.ver.outputs.name }}-b${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: MyTune ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          make_latest: true
          prerelease: false
          files: MyTune-arm64-v8a-${{ steps.ver.outputs.name }}.apk
