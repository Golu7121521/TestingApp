name: Build ARM64 Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.jks \
            -alias business_music_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=BusinessMusic, OU=Mobile, O=Business, L=City, S=State, C=IN"

      - name: Build ARM64 Release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename ARM64 APK
        run: |
          mkdir -p release_output
          APK_PATH=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "release_output/BusinessMusic-v1.0.${{ github.run_number }}-arm64-v8a.apk"
          ls -lh release_output/

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Business Music App v1.0.${{ github.run_number }} (ARM64)
          body: |
            Automated ARM64-v8a release build for **Business Music App**.
            Download the `.apk` file below and install it directly on your Android device.
          files: release_output/*.apk
          make_latest: true
