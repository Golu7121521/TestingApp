name: Build & Release VIBE MUSIC (ARM64 APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/vibe-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias vibemusic \
            -storepass vibemusic2026 \
            -keypass vibemusic2026 \
            -dname "CN=VibeMusic, OU=Mobile, O=VibeMusic, L=App, S=Android, C=US"

      - name: Build ARM64 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate and Rename ARM64 APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ARM64 APK not found!"
            exit 1
          fi
          cp "$APK_PATH" VibeMusic-arm64-v8a-release.apk
          echo "apk_file=VibeMusic-arm64-v8a-release.apk" >> $GITHUB_OUTPUT
          ls -lh VibeMusic-arm64-v8a-release.apk

      - name: Publish ARM64 APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VIBE MUSIC v1.0.${{ github.run_number }} (ARM64)
          body: |
            ### VIBE MUSIC - Offline Android Music Player (ARM64 Release)
            - **Architecture:** `arm64-v8a` only
            - **Features:** Media3 ExoPlayer, Jetpack Compose Material 3 AMOLED UI, 5/10-Band Hardware Equalizer, Gapless Playback, Folder Browser, Smart & Custom Room Playlists, Synced Lyrics, Sleep Timer, Android Auto & Lock-Screen MediaSession.
          files: VibeMusic-arm64-v8a-release.apk
          draft: false
          prerelease: false
