name: Build PlayNova & Publish to Releases

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Complete PlayNova Project Structure
        run: |
          mkdir -p app/src/main/java/com/playnova/player
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PlayNova"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.playnova.player"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.playnova.player"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0-HelioG80"

                  ndk {
                      abiFilters.add("arm64-v8a")
                      abiFilters.add("armeabi-v7a")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.10"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              val media3Version = "1.3.0"
              implementation("androidx.media3:media3-exoplayer:$media3Version")
              implementation("androidx.media3:media3-exoplayer-dash:$media3Version")
              implementation("androidx.media3:media3-exoplayer-hls:$media3Version")
              implementation("androidx.media3:media3-ui:$media3Version")
              implementation("androidx.media3:media3-session:$media3Version")
              implementation("androidx.media3:media3-common:$media3Version")

              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("io.coil-kt:coil-video:2.6.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="PlayNova"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate PlayNova Kotlin Source Code
        run: |
          cat << 'EOF' > app/src/main/java/com/playnova/player/MainActivity.kt
          package com.playnova.player

          import android.Manifest
          import android.app.Activity
          import android.app.PictureInPictureParams
          import android.content.ContentUris
          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.util.Rational
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.annotation.OptIn
          import androidx.compose.animation.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.exoplayer.DefaultLoadControl
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.trackselection.DefaultTrackSelector
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import kotlinx.coroutines.delay
          import kotlin.math.abs

          data class VideoItem(
              val id: Long,
              val uri: Uri,
              val title: String,
              val folderName: String,
              val duration: Long,
              val size: Long,
              val resolution: String,
              val dateAdded: Long
          )

          data class Playlist(
              val name: String,
              val videoIds: MutableList<Long> = mutableListOf()
          )

          val BgDark = Color(0xFF0B0C10)
          val SurfaceCard = Color(0xFF161821)
          val ElectricPurple = Color(0xFF8B5CF6)
          val VibrantBlue = Color(0xFF3B82F6)
          val TextWhite = Color(0xFFF3F4F6)
          val TextGray = Color(0xFF9CA3AF)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      PlayNovaTheme {
                          PlayNovaApp(activity = this)
                      }
                  }
              }
          }

          @Composable
          fun PlayNovaTheme(content: @Composable () -> Unit) {
              val colorScheme = darkColorScheme(
                  primary = ElectricPurple,
                  secondary = VibrantBlue,
                  background = BgDark,
                  surface = SurfaceCard,
                  onPrimary = Color.White,
                  onBackground = TextWhite,
                  onSurface = TextWhite
              )
              MaterialTheme(colorScheme = colorScheme, content = content)
          }

          @Composable
          fun PlayNovaApp(activity: Activity) {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("playnova_prefs", Context.MODE_PRIVATE) }

              var hasPermission by remember {
                  mutableStateOf(
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          ContextCompat.checkSelfPermission(context, Manifest.permission.READ_MEDIA_VIDEO) == PackageManager.PERMISSION_GRANTED
                      } else {
                          ContextCompat.checkSelfPermission(context, Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
                      }
                  )
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted -> hasPermission = granted }

              var videos by remember { mutableStateOf<List<VideoItem>>(emptyList()) }
              var favoriteIds by remember {
                  mutableStateOf(prefs.getStringSet("favorites", emptySet())?.mapNotNull { it.toLongOrNull() }?.toSet() ?: emptySet())
              }
              var historyIds by remember {
                  mutableStateOf(prefs.getString("history", "")?.split(",")?.mapNotNull { it.toLongOrNull() } ?: emptyList())
              }
              var playlists by remember {
                  mutableStateOf(listOf(Playlist("Watch Later"), Playlist("Movies"), Playlist("Music Videos")))
              }

              var currentTab by remember { mutableStateOf(0) }
              var selectedFolder by remember { mutableStateOf<String?>(null) }
              var searchQuery by remember { mutableStateOf("") }
              var isSearchActive by remember { mutableStateOf(false) }
              var isGridView by remember { mutableStateOf(true) }
              var sortOption by remember { mutableStateOf("Date") }

              var activeVideo by remember { mutableStateOf<VideoItem?>(null) }
              var isMiniPlayer by remember { mutableStateOf(false) }

              var defaultSpeed by remember { mutableStateOf(prefs.getFloat("default_speed", 1.0f)) }
              var resumePlayback by remember { mutableStateOf(prefs.getBoolean("resume_playback", true)) }
              var doubleTapSeekSec by remember { mutableStateOf(prefs.getInt("seek_sec", 10)) }
              var hardwareDecodePriority by remember { mutableStateOf(prefs.getBoolean("hw_decode", true)) }

              LaunchedEffect(hasPermission) {
                  if (hasPermission) {
                      videos = loadDeviceVideos(context)
                  }
              }

              fun saveFavorite(id: Long) {
                  favoriteIds = if (favoriteIds.contains(id)) favoriteIds - id else favoriteIds + id
                  prefs.edit().putStringSet("favorites", favoriteIds.map { it.toString() }.toSet()).apply()
              }

              fun addToHistory(id: Long) {
                  val updated = (listOf(id) + historyIds.filter { it != id }).take(30)
                  historyIds = updated
                  prefs.edit().putString("history", updated.joinToString(",")).apply()
              }

              fun startVideo(video: VideoItem) {
                  addToHistory(video.id)
                  activeVideo = video
                  isMiniPlayer = false
              }

              if (activeVideo != null && !isMiniPlayer) {
                  AdvancedVideoPlayerScreen(
                      video = activeVideo!!,
                      allVideos = videos,
                      activity = activity,
                      prefs = prefs,
                      resumeEnabled = resumePlayback,
                      defaultSpeed = defaultSpeed,
                      seekSeconds = doubleTapSeekSec,
                      hwPriority = hardwareDecodePriority,
                      isFavorite = favoriteIds.contains(activeVideo!!.id),
                      onToggleFavorite = { saveFavorite(activeVideo!!.id) },
                      onSwitchVideo = { nextVid -> startVideo(nextVid) },
                      onMinimizeToMiniPlayer = {
                          activity.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                          isMiniPlayer = true
                      },
                      onClosePlayer = {
                          activity.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                          activeVideo = null
                          isMiniPlayer = false
                      }
                  )
                  return
              }

              Scaffold(
                  containerColor = BgDark,
                  topBar = {
                      if (!isSearchActive) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 16.dp, vertical = 14.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(
                                      modifier = Modifier
                                          .size(38.dp)
                                          .clip(RoundedCornerShape(12.dp))
                                          .background(Brush.linearGradient(listOf(ElectricPurple, VibrantBlue))),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Icon(Icons.Default.PlayArrow, contentDescription = null, tint = Color.White)
                                  }
                                  Spacer(modifier = Modifier.width(10.dp))
                                  Column {
                                      Text("PlayNova", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = TextWhite)
                                      Text("Helio G80 Engine Ready", fontSize = 10.sp, color = ElectricPurple)
                                  }
                              }
                              Row {
                                  IconButton(onClick = { isSearchActive = true }) {
                                      Icon(Icons.Default.Search, contentDescription = "Search", tint = TextWhite)
                                  }
                                  IconButton(onClick = { if (hasPermission) videos = loadDeviceVideos(context) }) {
                                      Icon(Icons.Default.Refresh, contentDescription = "Rescan", tint = TextWhite)
                                  }
                              }
                          }
                      } else {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(12.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              OutlinedTextField(
                                  value = searchQuery,
                                  onValueChange = { searchQuery = it },
                                  placeholder = { Text("Search videos, MKV, MP4...", color = TextGray) },
                                  modifier = Modifier.weight(1f),
                                  singleLine = true,
                                  leadingIcon = { Icon(Icons.Default.Search, null, tint = ElectricPurple) },
                                  trailingIcon = {
                                      IconButton(onClick = {
                                          searchQuery = ""
                                          isSearchActive = false
                                      }) {
                                          Icon(Icons.Default.Close, null, tint = TextGray)
                                      }
                                  }
                              )
                          }
                      }
                  },
                  bottomBar = {
                      Column {
                          if (activeVideo != null && isMiniPlayer) {
                              Surface(
                                  color = Color(0xFF1E2230),
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(horizontal = 8.dp, vertical = 4.dp)
                                      .clip(RoundedCornerShape(14.dp))
                                      .clickable { isMiniPlayer = false }
                              ) {
                                  Row(
                                      modifier = Modifier.padding(12.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Icon(Icons.Default.PlayCircleFilled, null, tint = ElectricPurple, modifier = Modifier.size(34.dp))
                                      Spacer(Modifier.width(10.dp))
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text(activeVideo!!.title, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                                          Text("Tap to expand player", fontSize = 11.sp, color = TextGray)
                                      }
                                      IconButton(onClick = { activeVideo = null; isMiniPlayer = false }) {
                                          Icon(Icons.Default.Close, null, tint = TextWhite)
                                      }
                                  }
                              }
                          }

                          NavigationBar(containerColor = SurfaceCard) {
                              val items = listOf(
                                  Triple(0, "Home", Icons.Default.Home),
                                  Triple(1, "Videos", Icons.Default.VideoLibrary),
                                  Triple(2, "Folders", Icons.Default.Folder),
                                  Triple(3, "Playlists", Icons.Default.PlaylistPlay),
                                  Triple(4, "Settings", Icons.Default.Settings)
                              )
                              items.forEach { (index, label, icon) ->
                                  NavigationBarItem(
                                      selected = currentTab == index,
                                      onClick = {
                                          currentTab = index
                                          selectedFolder = null
                                      },
                                      icon = { Icon(icon, contentDescription = label) },
                                      label = { Text(label, fontSize = 11.sp) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = ElectricPurple,
                                          selectedTextColor = ElectricPurple,
                                          unselectedIconColor = TextGray,
                                          unselectedTextColor = TextGray,
                                          indicatorColor = ElectricPurple.copy(alpha = 0.15f)
                                      )
                                  )
                              }
                          }
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.padding(padding).fillMaxSize()) {
                      if (!hasPermission) {
                          PermissionScreen {
                              val perm = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  Manifest.permission.READ_MEDIA_VIDEO
                              } else {
                                  Manifest.permission.READ_EXTERNAL_STORAGE
                              }
                              permissionLauncher.launch(perm)
                          }
                      } else if (isSearchActive && searchQuery.isNotEmpty()) {
                          val filtered = videos.filter { it.title.contains(searchQuery, ignoreCase = true) }
                          VideoListSection(
                              videos = filtered,
                              isGrid = false,
                              favoriteIds = favoriteIds,
                              onPlay = { startVideo(it) },
                              onToggleFav = { saveFavorite(it.id) }
                          )
                      } else {
                          when (currentTab) {
                              0 -> HomeScreen(
                                  videos = videos,
                                  historyIds = historyIds,
                                  favoriteIds = favoriteIds,
                                  prefs = prefs,
                                  onPlay = { startVideo(it) },
                                  onNavigateTab = { currentTab = it }
                              )
                              1 -> AllVideosScreen(
                                  videos = videos,
                                  isGrid = isGridView,
                                  sortOption = sortOption,
                                  favoriteIds = favoriteIds,
                                  onToggleGrid = { isGridView = !isGridView },
                                  onChangeSort = { sortOption = it },
                                  onPlay = { startVideo(it) },
                                  onToggleFav = { saveFavorite(it.id) }
                              )
                              2 -> FoldersScreen(
                                  videos = videos,
                                  selectedFolder = selectedFolder,
                                  favoriteIds = favoriteIds,
                                  onSelectFolder = { selectedFolder = it },
                                  onPlay = { startVideo(it) },
                                  onToggleFav = { saveFavorite(it.id) }
                              )
                              3 -> PlaylistsScreen(
                                  videos = videos,
                                  favoriteIds = favoriteIds,
                                  playlists = playlists,
                                  onCreatePlaylist = { name ->
                                      if (name.isNotBlank()) playlists = playlists + Playlist(name)
                                  },
                                  onPlay = { startVideo(it) }
                              )
                              4 -> SettingsScreen(
                                  defaultSpeed = defaultSpeed,
                                  resumePlayback = resumePlayback,
                                  doubleTapSeekSec = doubleTapSeekSec,
                                  hardwareDecodePriority = hardwareDecodePriority,
                                  onSpeedChange = { defaultSpeed = it; prefs.edit().putFloat("default_speed", it).apply() },
                                  onResumeChange = { resumePlayback = it; prefs.edit().putBoolean("resume_playback", it).apply() },
                                  onSeekSecChange = { doubleTapSeekSec = it; prefs.edit().putInt("seek_sec", it).apply() },
                                  onHwDecodeChange = { hardwareDecodePriority = it; prefs.edit().putBoolean("hw_decode", it).apply() },
                                  onClearHistory = {
                                      historyIds = emptyList()
                                      prefs.edit().remove("history").apply()
                                  }
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun PermissionScreen(onRequest: () -> Unit) {
              Column(
                  modifier = Modifier.fillMaxSize().padding(32.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Icon(Icons.Default.VideoLibrary, contentDescription = null, tint = ElectricPurple, modifier = Modifier.size(72.dp))
                  Spacer(Modifier.height(16.dp))
                  Text("Storage Access Required", fontSize = 22.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(8.dp))
                  Text(
                      "PlayNova needs permission to scan and play local MP4, MKV, and WebM videos on your Redmi 9 Prime.",
                      color = TextGray,
                      fontSize = 14.sp
                  )
                  Spacer(Modifier.height(24.dp))
                  Button(
                      onClick = onRequest,
                      colors = ButtonDefaults.buttonColors(containerColor = ElectricPurple),
                      shape = RoundedCornerShape(14.dp)
                  ) {
                      Icon(Icons.Default.FolderOpen, null)
                      Spacer(Modifier.width(8.dp))
                      Text("Grant Video Permission")
                  }
              }
          }

          @Composable
          fun HomeScreen(
              videos: List<VideoItem>,
              historyIds: List<Long>,
              favoriteIds: Set<Long>,
              prefs: android.content.SharedPreferences,
              onPlay: (VideoItem) -> Unit,
              onNavigateTab: (Int) -> Unit
          ) {
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(20.dp)
              ) {
                  item {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          QuickCard("All Videos", "${videos.size} files", Icons.Default.VideoLibrary, Modifier.weight(1f)) { onNavigateTab(1) }
                          QuickCard("Folders", "${videos.map { it.folderName }.distinct().size} dirs", Icons.Default.Folder, Modifier.weight(1f)) { onNavigateTab(2) }
                          QuickCard("Favorites", "${favoriteIds.size} saved", Icons.Default.Favorite, Modifier.weight(1f)) { onNavigateTab(3) }
                      }
                  }

                  val historyVideos = historyIds.mapNotNull { id -> videos.find { it.id == id } }
                  if (historyVideos.isNotEmpty()) {
                      item {
                          Text("Continue Watching", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(10.dp))
                          LazyRow(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              items(historyVideos) { video ->
                                  val savedPos = prefs.getLong("pos_${video.id}", 0L)
                                  val progress = if (video.duration > 0) (savedPos.toFloat() / video.duration.toFloat()).coerceIn(0f, 1f) else 0f
                                  Surface(
                                      color = SurfaceCard,
                                      shape = RoundedCornerShape(16.dp),
                                      modifier = Modifier
                                          .width(220.dp)
                                          .clickable { onPlay(video) }
                                  ) {
                                      Column(modifier = Modifier.padding(12.dp)) {
                                          Box(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .height(100.dp)
                                                  .clip(RoundedCornerShape(12.dp))
                                                  .background(Brush.linearGradient(listOf(Color(0xFF232738), Color(0xFF151824)))),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Icon(Icons.Default.PlayCircleOutline, null, tint = ElectricPurple, modifier = Modifier.size(42.dp))
                                              Text(
                                                  formatDuration(video.duration),
                                                  fontSize = 11.sp,
                                                  modifier = Modifier
                                                      .align(Alignment.BottomEnd)
                                                      .padding(6.dp)
                                                      .background(Color.Black.copy(alpha = 0.7f), RoundedCornerShape(4.dp))
                                                      .padding(horizontal = 4.dp, vertical = 2.dp)
                                              )
                                          }
                                          Spacer(Modifier.height(8.dp))
                                          Text(video.title, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                                          Spacer(Modifier.height(6.dp))
                                          LinearProgressIndicator(
                                              progress = progress,
                                              modifier = Modifier.fillMaxWidth().height(4.dp).clip(RoundedCornerShape(2.dp)),
                                              color = ElectricPurple,
                                              trackColor = Color.DarkGray
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }

                  item {
                      Text("Recently Added", fontSize = 18.sp, fontWeight = FontWeight.Bold)
