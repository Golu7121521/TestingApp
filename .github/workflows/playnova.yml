          @OptIn(UnstableApi::class)
          @Composable
          fun AdvancedVideoPlayerScreen(
              video: VideoItem,
              allVideos: List<VideoItem>,
              activity: Activity,
              prefs: android.content.SharedPreferences,
              resumeEnabled: Boolean,
              defaultSpeed: Float,
              seekSeconds: Int,
              hwPriority: Boolean,
              isFavorite: Boolean,
              onToggleFavorite: () -> Unit,
              onSwitchVideo: (VideoItem) -> Unit,
              onMinimizeToMiniPlayer: () -> Unit,
              onClosePlayer: () -> Unit
          ) {
              val context = LocalContext.current
              val audioManager = remember { context.getSystemService(Context.AUDIO_SERVICE) as AudioManager }

              val exoPlayer = remember(video.uri) {
                  val renderersFactory = DefaultRenderersFactory(context)
                      .setEnableDecoderFallback(true)
                      .setExtensionRendererMode(
                          if (hwPriority) DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON
                          else DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER
                      )

                  val trackSelector = DefaultTrackSelector(context).apply {
                      setParameters(buildUponParameters().setMaxVideoSizeSd().clearVideoSizeConstraints())
                  }

                  val loadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(15000, 50000, 1500, 3000)
                      .build()

                  ExoPlayer.Builder(context, renderersFactory)
                      .setTrackSelector(trackSelector)
                      .setLoadControl(loadControl)
                      .build().apply {
                          setMediaItem(MediaItem.fromUri(video.uri))
                          prepare()
                          val savedPos = prefs.getLong("pos_${video.id}", 0L)
                          if (resumeEnabled && savedPos > 2000L && savedPos < video.duration - 3000L) {
                              seekTo(savedPos)
                          }
                          setPlaybackSpeed(defaultSpeed)
                          playWhenReady = true
                      }
              }

              var isPlaying by remember { mutableStateOf(true) }
              var currentPosition by remember { mutableStateOf(0L) }
              var duration by remember { mutableStateOf(video.duration.coerceAtLeast(1L)) }
              var showControls by remember { mutableStateOf(true) }
              var isLocked by remember { mutableStateOf(false) }
              var playbackSpeed by remember { mutableStateOf(defaultSpeed) }
              var resizeMode by remember { mutableStateOf(AspectRatioFrameLayout.RESIZE_MODE_FIT) }
              var showSettingsSheet by remember { mutableStateOf(false) }
              var gestureStatusText by remember { mutableStateOf<String?>(null) }
              var decoderErrorText by remember { mutableStateOf<String?>(null) }
              var isLandscape by remember { mutableStateOf(false) }
              var abStart by remember { mutableStateOf<Long?>(null) }
              var abEnd by remember { mutableStateOf<Long?>(null) }

              LaunchedEffect(exoPlayer) {
                  while (true) {
                      currentPosition = exoPlayer.currentPosition
                      if (exoPlayer.duration > 0) duration = exoPlayer.duration
                      isPlaying = exoPlayer.isPlaying
                      prefs.edit().putLong("pos_${video.id}", currentPosition).apply()

                      if (abStart != null && abEnd != null && currentPosition >= abEnd!!) {
                          exoPlayer.seekTo(abStart!!)
                      }
                      delay(500)
                  }
              }

              DisposableEffect(exoPlayer) {
                  val listener = object : Player.Listener {
                      override fun onPlayerError(error: PlaybackException) {
                          decoderErrorText = "Decoder Alert: ${error.errorCodeName}. Trying safe recovery..."
                          exoPlayer.prepare()
                          exoPlayer.play()
                      }
                  }
                  exoPlayer.addListener(listener)
                  onDispose {
                      prefs.edit().putLong("pos_${video.id}", exoPlayer.currentPosition).apply()
                      exoPlayer.removeListener(listener)
                      exoPlayer.release()
                  }
              }

              BackHandler {
                  onClosePlayer()
              }

              Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                  AndroidView(
                      factory = { ctx ->
                          PlayerView(ctx).apply {
                              useController = false
                              player = exoPlayer
                              this.resizeMode = resizeMode
                              layoutParams = FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                              keepScreenOn = true
                          }
                      },
                      update = { view ->
                          view.player = exoPlayer
                          view.resizeMode = resizeMode
                      },
                      modifier = Modifier.fillMaxSize()
                  )

                  if (!isLocked) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .pointerInput(Unit) {
                                  detectTapGestures(
                                      onTap = { showControls = !showControls },
                                      onDoubleTap = { offset ->
                                          val width = size.width
                                          if (offset.x < width / 2) {
                                              val target = (exoPlayer.currentPosition - seekSeconds * 1000L).coerceAtLeast(0L)
                                              exoPlayer.seekTo(target)
                                              gestureStatusText = "⏪ -${seekSeconds}s"
                                          } else {
                                              val target = (exoPlayer.currentPosition + seekSeconds * 1000L).coerceAtMost(duration)
                                              exoPlayer.seekTo(target)
                                              gestureStatusText = "⏩ +${seekSeconds}s"
                                          }
                                      },
                                      onLongPress = {
                                          exoPlayer.setPlaybackSpeed(2.0f)
                                          gestureStatusText = "⚡ 2.0x Speed Boost"
                                      },
                                      onPress = {
                                          tryAwaitRelease()
                                          if (exoPlayer.playbackParameters.speed == 2.0f && playbackSpeed != 2.0f) {
                                              exoPlayer.setPlaybackSpeed(playbackSpeed)
                                              gestureStatusText = null
                                          }
                                      }
                                  )
                              }
                              .pointerInput(Unit) {
                                  detectDragGestures(
                                      onDragEnd = { gestureStatusText = null },
                                      onDragCancel = { gestureStatusText = null },
                                      onDrag = { change, dragAmount ->
                                          change.consume()
                                          val w = size.width
                                          val dx = dragAmount.x
                                          val dy = dragAmount.y

                                          if (abs(dx) > abs(dy)) {
                                              val deltaMs = (dx * 150).toLong()
                                              val nextPos = (exoPlayer.currentPosition + deltaMs).coerceIn(0L, duration)
                                              exoPlayer.seekTo(nextPos)
                                              gestureStatusText = "Seek: ${formatDuration(nextPos)}"
                                          } else {
                                              if (change.position.x < w / 2) {
                                                  val lp = activity.window.attributes
                                                  val currentB = if (lp.screenBrightness < 0) 0.5f else lp.screenBrightness
                                                  val nextB = (currentB - dy / 600f).coerceIn(0.05f, 1.0f)
                                                  lp.screenBrightness = nextB
                                                  activity.window.attributes = lp
                                                  gestureStatusText = "☀️ Brightness: ${(nextB * 100).toInt()}%"
                                              } else {
                                                  val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                                  val curVol = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                                                  val deltaV = if (dy < -12) 1 else if (dy > 12) -1 else 0
                                                  if (deltaV != 0) {
                                                      val nextV = (curVol + deltaV).coerceIn(0, maxVol)
                                                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, nextV, 0)
                                                      gestureStatusText = "🔊 Volume: ${(nextV * 100 / maxVol)}%"
                                                  }
                                              }
                                          }
                                      }
                                  )
                              }
                      )
                  } else {
                      Box(
                          modifier = Modifier.fillMaxSize().clickable { showControls = !showControls }
                      )
                  }

                  LaunchedEffect(gestureStatusText) {
                      if (gestureStatusText != null && !gestureStatusText!!.contains("2.0x")) {
                          delay(900)
                          gestureStatusText = null
                      }
                  }

                  if (gestureStatusText != null) {
                      Surface(
                          color = Color.Black.copy(alpha = 0.75f),
                          shape = RoundedCornerShape(14.dp),
                          modifier = Modifier.align(Alignment.Center)
                      ) {
                          Text(
                              text = gestureStatusText!!,
                              color = Color.White,
                              fontWeight = FontWeight.Bold,
                              fontSize = 18.sp,
                              modifier = Modifier.padding(horizontal = 20.dp, vertical = 12.dp)
                          )
                      }
                  }

                  if (decoderErrorText != null) {
                      Surface(
                          color = Color(0xFFB91C1C).copy(alpha = 0.9f),
                          shape = RoundedCornerShape(8.dp),
                          modifier = Modifier.align(Alignment.TopCenter).padding(top = 60.dp)
                      ) {
                          Text(decoderErrorText!!, color = Color.White, fontSize = 12.sp, modifier = Modifier.padding(8.dp))
                      }
                  }

                  if (isLocked && showControls) {
                      IconButton(
                          onClick = { isLocked = false },
                          modifier = Modifier
                              .align(Alignment.CenterStart)
                              .padding(24.dp)
                              .background(ElectricPurple, CircleShape)
                      ) {
                          Icon(Icons.Default.LockOpen, "Unlock", tint = Color.White)
                      }
                  }

                  AnimatedVisibility(
                      visible = showControls && !isLocked,
                      enter = fadeIn(),
                      exit = fadeOut()
                  ) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color.Black.copy(alpha = 0.45f))
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .align(Alignment.TopCenter)
                                  .padding(16.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              IconButton(onClick = onClosePlayer) {
                                  Icon(Icons.Default.ArrowBack, "Back", tint = Color.White)
                              }
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(video.title, color = Color.White, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text("${video.resolution} • Helio G80 HW+SW", color = ElectricPurple, fontSize = 11.sp)
                              }
                              IconButton(onClick = onToggleFavorite) {
                                  Icon(if (isFavorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder, null, tint = if (isFavorite) Color(0xFFEC4899) else Color.White)
                              }
                              IconButton(onClick = onMinimizeToMiniPlayer) {
                                  Icon(Icons.Default.PictureInPictureAlt, "Mini Player", tint = Color.White)
                              }
                              IconButton(onClick = {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      val params = PictureInPictureParams.Builder()
                                          .setAspectRatio(Rational(16, 9))
                                          .build()
                                      activity.enterPictureInPictureMode(params)
                                  }
                              }) {
                                  Icon(Icons.Default.OpenInNew, "System PiP", tint = Color.White)
                              }
                              IconButton(onClick = { showSettingsSheet = true }) {
                                  Icon(Icons.Default.Tune, "Settings", tint = Color.White)
                              }
                          }

                          Row(
                              modifier = Modifier.align(Alignment.Center),
                              horizontalArrangement = Arrangement.spacedBy(28.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              IconButton(onClick = {
                                  val idx = allVideos.indexOfFirst { it.id == video.id }
                                  if (idx > 0) onSwitchVideo(allVideos[idx - 1])
                              }) {
                                  Icon(Icons.Default.SkipPrevious, null, tint = Color.White, modifier = Modifier.size(38.dp))
                              }

                              IconButton(onClick = {
                                  exoPlayer.seekTo((exoPlayer.currentPosition - seekSeconds * 1000L).coerceAtLeast(0L))
                              }) {
                                  Icon(Icons.Default.Replay10, null, tint = Color.White, modifier = Modifier.size(38.dp))
                              }

                              Box(
                                  modifier = Modifier
                                      .size(68.dp)
                                      .clip(CircleShape)
                                      .background(ElectricPurple)
                                      .clickable {
                                          if (exoPlayer.isPlaying) exoPlayer.pause() else exoPlayer.play()
                                          isPlaying = exoPlayer.isPlaying
                                      },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Icon(
                                      if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                      contentDescription = "Play/Pause",
                                      tint = Color.White,
                                      modifier = Modifier.size(40.dp)
                                  )
                              }

                              IconButton(onClick = {
                                  exoPlayer.seekTo((exoPlayer.currentPosition + seekSeconds * 1000L).coerceAtMost(duration))
                              }) {
                                  Icon(Icons.Default.Forward10, null, tint = Color.White, modifier = Modifier.size(38.dp))
                              }

                              IconButton(onClick = {
                                  val idx = allVideos.indexOfFirst { it.id == video.id }
                                  if (idx != -1 && idx < allVideos.size - 1) onSwitchVideo(allVideos[idx + 1])
                              }) {
                                  Icon(Icons.Default.SkipNext, null, tint = Color.White, modifier = Modifier.size(38.dp))
                              }
                          }

                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .align(Alignment.BottomCenter)
                                  .padding(16.dp)
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(formatDuration(currentPosition), color = Color.White, fontSize = 12.sp)
                                  Slider(
                                      value = currentPosition.toFloat(),
                                      onValueChange = {
                                          currentPosition = it.toLong()
                                          exoPlayer.seekTo(currentPosition)
                                      },
                                      valueRange = 0f..duration.toFloat().coerceAtLeast(1f),
                                      modifier = Modifier.weight(1f).padding(horizontal = 10.dp),
                                      colors = SliderDefaults.colors(
                                          thumbColor = ElectricPurple,
                                          activeTrackColor = ElectricPurple
                                      )
                                  )
                                  Text(formatDuration(duration), color = Color.White, fontSize = 12.sp)
                              }

                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  IconButton(onClick = { isLocked = true }) {
                                      Icon(Icons.Default.Lock, "Lock", tint = Color.White)
                                  }

                                  TextButton(onClick = {
                                      val nextSpeed = when (playbackSpeed) {
                                          1.0f -> 1.25f
                                          1.25f -> 1.5f
                                          1.5f -> 2.0f
                                          2.0f -> 0.75f
                                          else -> 1.0f
                                      }
                                      playbackSpeed = nextSpeed
                                      exoPlayer.setPlaybackSpeed(nextSpeed)
                                  }) {
                                      Text("${playbackSpeed}x Speed", color = Color.White, fontWeight = FontWeight.Bold)
                                  }

                                  TextButton(onClick = {
                                      resizeMode = when (resizeMode) {
                                          AspectRatioFrameLayout.RESIZE_MODE_FIT -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                                          AspectRatioFrameLayout.RESIZE_MODE_ZOOM -> AspectRatioFrameLayout.RESIZE_MODE_FILL
                                          else -> AspectRatioFrameLayout.RESIZE_MODE_FIT
                                      }
                                  }) {
                                      Icon(Icons.Default.AspectRatio, null, tint = Color.White)
                                      Spacer(Modifier.width(4.dp))
                                      Text("Aspect", color = Color.White)
                                  }

                                  IconButton(onClick = {
                                      isLandscape = !isLandscape
                                      activity.requestedOrientation = if (isLandscape) {
                                          ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                                      } else {
                                          ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                                      }
                                  }) {
                                      Icon(Icons.Default.ScreenRotation, "Rotate", tint = Color.White)
                                  }
                              }
                          }
                      }
                  }

                  if (showSettingsSheet) {
                      AlertDialog(
                          onDismissRequest = { showSettingsSheet = false },
                          containerColor = SurfaceCard,
                          title = { Text("Playback & Track Controls", fontWeight = FontWeight.Bold) },
                          text = {
                              Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                  Text("Playback Speed", color = ElectricPurple, fontWeight = FontWeight.SemiBold, fontSize = 13.sp)
                                  Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                      listOf(0.5f, 1.0f, 1.25f, 1.5f, 2.0f).forEach { spd ->
                                          FilterChip(
                                              selected = playbackSpeed == spd,
                                              onClick = {
                                                  playbackSpeed = spd
                                                  exoPlayer.setPlaybackSpeed(spd)
                                              },
                                              label = { Text("${spd}x", fontSize = 11.sp) }
                                          )
                                      }
                                  }

                                  Text("A-B Segment Repeat", color = ElectricPurple, fontWeight = FontWeight.SemiBold, fontSize = 13.sp)
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      OutlinedButton(onClick = { abStart = currentPosition }) {
                                          Text(if (abStart == null) "Set A" else "A: ${formatDuration(abStart!!)}", fontSize = 11.sp)
                                      }
                                      OutlinedButton(onClick = { abEnd = currentPosition }) {
                                          Text(if (abEnd == null) "Set B" else "B: ${formatDuration(abEnd!!)}", fontSize = 11.sp)
                                      }
                                      TextButton(onClick = { abStart = null; abEnd = null }) {
                                          Text("Clear")
                                      }
                                  }

                                  Text("Media Technical Info", color = ElectricPurple, fontWeight = FontWeight.SemiBold, fontSize = 13.sp)
                                  Text(
                                      "File: ${video.title}\nResolution: ${video.resolution}\nSize: ${formatSize(video.size)}\nDecoder: Media3 ExoPlayer (Hardware + Software Fallback Active)",
                                      color = TextGray,
                                      fontSize = 12.sp
                                  )
                              }
                          },
                          confirmButton = {
                              TextButton(onClick = { showSettingsSheet = false }) {
                                  Text("Done", color = ElectricPurple)
                              }
                          }
                      )
                  }
              }
          }

          fun loadDeviceVideos(context: Context): List<VideoItem> {
              val list = mutableListOf<VideoItem>()
              val projection = arrayOf(
                  MediaStore.Video.Media._ID,
                  MediaStore.Video.Media.DISPLAY_NAME,
                  MediaStore.Video.Media.BUCKET_DISPLAY_NAME,
                  MediaStore.Video.Media.DURATION,
                  MediaStore.Video.Media.SIZE,
                  MediaStore.Video.Media.WIDTH,
                  MediaStore.Video.Media.HEIGHT,
                  MediaStore.Video.Media.DATE_ADDED
              )
              val sortOrder = "${MediaStore.Video.Media.DATE_ADDED} DESC"

              context.contentResolver.query(
                  MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                  projection,
                  null,
                  null,
                  sortOrder
              )?.use { cursor ->
                  val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                  val nameCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                  val folderCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                  val durCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                  val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                  val wCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.WIDTH)
                  val hCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.HEIGHT)
                  val dateCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED)

                  while (cursor.moveToNext()) {
                      val id = cursor.getLong(idCol)
                      val name = cursor.getString(nameCol) ?: "Unknown Video"
                      val folder = cursor.getString(folderCol) ?: "Internal Storage"
                      val dur = cursor.getLong(durCol)
                      val size = cursor.getLong(sizeCol)
                      val w = cursor.getInt(wCol)
                      val h = cursor.getInt(hCol)
                      val date = cursor.getLong(dateCol)
                      val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)
                      val res = if (w > 0 && h > 0) "${w}x${h}" else "HD"

                      if (dur > 0) {
                          list.add(VideoItem(id, uri, name, folder, dur, size, res, date))
                      }
                  }
              }
              return list
          }

          fun formatDuration(ms: Long): String {
              val totalSec = (ms / 1000).coerceAtLeast(0)
              val hrs = totalSec / 3600
              val mins = (totalSec % 3600) / 60
              val secs = totalSec % 60
              return if (hrs > 0) String.format("%d:%02d:%02d", hrs, mins, secs)
              else String.format("%02d:%02d", mins, secs)
          }

          fun formatSize(bytes: Long): String {
              val mb = bytes / (1024.0 * 1024.0)
              return if (mb >= 1024) String.format("%.2f GB", mb / 1024.0)
              else String.format("%.1f MB", mb)
          }
          EOF

      - name: Install Gradle & Build APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Assemble Release APK (Signed for immediate install)
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk PlayNova-v1.0.${{ github.run_number }}-Redmi9Prime.apk

      - name: Upload APK directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "PlayNova v1.0.${{ github.run_number }} (Redmi 9 Prime Edition)"
          body: |
            ### 🚀 PlayNova Next-Gen Video Player
            - **Target Device:** Optimized for Redmi 9 Prime (MediaTek Helio G80 `arm64-v8a`)
            - **Decoder Engine:** Media3 ExoPlayer with Hardware Acceleration + Automatic Software Fallback (`setEnableDecoderFallback(true)`)
          files: PlayNova-v1.0.${{ github.run_number }}-Redmi9Prime.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
