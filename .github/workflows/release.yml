name: Build APK and publish to Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release, e.g. 1.2.7'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.7 (got: $INPUT_VERSION)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version in app/build.gradle
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - "$INPUT_VERSION" <<'PY'
          import re, sys
          major, minor, patch = map(int, sys.argv[1].split('.'))
          code = major * 10000 + minor * 100 + patch   # 1.2.7 -> 10207, always increasing
          p = 'app/build.gradle'
          s = open(p).read()
          s, n1 = re.subn(r'versionCode \d+', f'versionCode {code}', s)
          s, n2 = re.subn(r'versionName "[^"]*"', f'versionName "{sys.argv[1]}"', s)
          assert n1 == 1 and n2 == 1, 'could not find version lines'
          open(p, 'w').write(s)
          print(f'versionName={sys.argv[1]} versionCode={code}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK (arm64-v8a only)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Uploading $APK to release $TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" "$APK" --title "$TAG" --target "$GITHUB_SHA" --latest --generate-notes
          fi
          echo "---- Release check ----"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets \
            --jq '"URL: \(.url)\nDraft: \(.isDraft)\nPrerelease: \(.isPrerelease)\nAssets: \([.assets[].name] | join(", "))"'
