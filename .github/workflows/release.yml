name: Build and Release ARM64 APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v (example: 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed iuhto create the GitHub Release with GITHUB_TOKEN

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like 1.2.3 (got: $VERSION)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Using persistent keystore from GitHub Secrets."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PASS="$RELEASE_KEYSTORE_PASSWORD"; ALIAS="$RELEASE_KEY_ALIAS"; KEY_PASS="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
          else
            echo "::warning::No signing secrets found. Generating a THROWAWAY key for this build. Updates signed with different keys cannot be installed over each other."
            STORE_PASS="$(openssl rand -hex 16)"; ALIAS="uvp"; KEY_PASS="$STORE_PASS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Universal Video Player"
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build checks and release APK
        run: >
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest :app:assembleRelease
          -PappVersion=${{ steps.ver.outputs.version }}
          -PappVersionCode=${{ github.run_number }}

      - name: Verify APK and architecture
        id: apk
        run: |
          SRC="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "APK: $SRC"
          "$BT/apksigner" verify --verbose "$SRC"
          "$BT/aapt" dump badging "$SRC" | grep -E "^package:|native-code|sdkVersion|targetSdkVersion" || true
          echo "--- native libraries in APK ---"
          LIBS="$(unzip -Z1 "$SRC" | grep '^lib/' || true)"
          if [ -z "$LIBS" ]; then
            echo "No native libraries bundled: the APK contains only architecture-independent code and runs natively on ARM64."
          else
            echo "$LIBS"
            if echo "$LIBS" | grep -Eq '^lib/(armeabi-v7a|armeabi|x86|x86_64|mips)'; then
              echo "::error::APK contains non-ARM64 native libraries"; exit 1
            fi
            echo "$LIBS" | grep -q '^lib/arm64-v8a/' || { echo "::error::No arm64-v8a libraries found"; exit 1; }
          fi
          NAME="UniversalVideoPlayer-arm64-v${{ steps.ver.outputs.version }}.apk"
          mkdir -p release
          cp "$SRC" "release/$NAME"
          (cd release && sha256sum "$NAME" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > release/NOTES.md <<NOTES
          ## Universal Video Player v${{ steps.ver.outputs.version }}

          - **Build date:** ${{ steps.ver.outputs.date }} (UTC)
          - **Architecture:** ARM64 (arm64-v8a). No x86 or 32-bit ARM native code is included.
          - **Minimum Android:** 7.0 (API 24)

          ### Changes
          - Media3 ExoPlayer playback for MP4, MKV, WebM, audio, HLS, DASH and SmoothStreaming links.
          - Home, Advance, History and Playlist tabs with Material 3 light/dark themes.
          - Immersive player with gestures, track selection, Picture-in-Picture and resume.

          ### Known limitations
          - Links from YouTube, Instagram, TikTok, Netflix and similar sites are not supported; use direct media URLs.
          - DRM works only where the device supports the chosen scheme (PlayReady is rarely available).
          - Background (screen-off) playback is not included in this version.
          - Thumbnails are generated only for direct files, not for HLS/DASH streams.
          - If no signing secrets are configured, each build uses a new temporary key.
          NOTES
          sed -i 's/^          //' release/NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Universal Video Player v${{ steps.ver.outputs.version }}
          body_path: release/NOTES.md
          files: |
            release/${{ steps.apk.outputs.name }}
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
